name: topout-prod

x-logging: &logging
  driver: json-file
  options: { max-size: '10m', max-file: '3' }

services:
  gateway:
    image: topout-gateway:${RELEASE_SHA:?Set the full release SHA}
    ports: ['127.0.0.1:18082:80']
    networks:
      app: { ipv4_address: 172.30.82.2 }
    restart: unless-stopped
    mem_limit: 256m
    logging: *logging
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    image: topout-backend:${RELEASE_SHA:?Set the full release SHA}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: '8080'
      TOPOUT_SECRETS_FILE: /run/secrets/runtime_config
      AllowedHosts: topout.jackhoffsten.se;localhost
      Web__AllowedOrigins__0: https://topout.jackhoffsten.se
      ReverseProxy__KnownProxies__0: 172.30.82.2
    secrets: [runtime_config]
    networks: [app, database]
    read_only: true
    tmpfs: ['/tmp:size=128m,mode=1777']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 768m
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost:8080/health']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *logging

  migrate:
    image: topout-backend:${RELEASE_SHA:?Set the full release SHA}
    command: ['--migrate']
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      TOPOUT_SECRETS_FILE: /run/secrets/migration_config
    secrets: [migration_config]
    networks: [database]
    read_only: true
    tmpfs: ['/tmp:size=128m,mode=1777']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 768m
    profiles: [migration]
    logging: *logging

  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: topout
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [admin_password, app_password, migration_password]
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    networks: [database]
    mem_limit: 768m
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d topout']
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

networks:
  app:
    ipam:
      config: [{ subnet: 172.30.82.0/24 }]
  database: { internal: true }

volumes:
  postgres_data: {}

secrets:
  admin_password: { file: /etc/topout/secrets/admin_password }
  app_password: { file: /etc/topout/secrets/app_password }
  migration_password: { file: /etc/topout/secrets/migration_password }
  runtime_config: { file: /etc/topout/secrets/runtime.json }
  migration_config: { file: /etc/topout/secrets/migration.json }
